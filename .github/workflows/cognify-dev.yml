# Cognify downstream validation for the `dev` integration branch and for
# promotions into `main` (Cognify's stable branch; see
# DevDocs/Governance/UPSTREAM_SYNC_AND_CUSTOMIZATION_POLICY.md).
#
# The inherited upstream workflows (pr.yml, codeql.yml, ...) only trigger for
# `main` / `release/*` and run on Microsoft's self-hosted 1ES pools, so pull
# requests into `dev` otherwise receive no automated checks. This workflow runs
# the Sprint 0.5 baseline gates on GitHub-hosted runners:
#   - pnpm run typecheck-client
#   - pnpm run test-node
#   - eslint on Cognify-owned paths (extensions/cognify-ai, scripts/cognify)
#   - extensions/cognify-ai unit tests (typecheck-test, test)
#   - extensions/cognify-ai integration tests in Electron against fake vendors, including the MVP
#     scenario end to end (S6-06)
#   - the shipped-build check (S6-16): cognify-ai built by the dev build's gulp task and by the
#     product's packaging, each activated in Electron
#   - extensions/cognify-ai unit tests on Windows (S6-16)
#   - node scripts/cognify/check-product-identity.mts
#   - node scripts/cognify/check-upstream-baseline.mts
#
# Action references are pinned to the same commit SHAs used by the upstream
# workflows. No repository secrets beyond the default GITHUB_TOKEN are used.
name: Cognify (dev)

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VSCODE_QUALITY: 'oss'

jobs:
  validate:
    name: Typecheck, Unit Tests & Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full commit history (without blobs) so the upstream baseline check
          # can verify the accepted upstream commit is an ancestor of HEAD.
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      # Upstream moved from npm to pnpm (2026-11); the version comes from
      # `packageManager` in package.json.
      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: ./.github/actions/restore-node-modules
        with:
          key-prefix: cognify-node_modules-pnpm
          key-args: "compile $(node -p process.arch)"

      - name: Install build tools
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: sudo apt update -y && sudo apt install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev libsecret-1-dev

      - name: Install Electron headers
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: node build/npm/preinstall.ts

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: |
          set -e

          for i in {1..5}; do # try 5 times
            pnpm install --frozen-lockfile && break
            if [ $i -eq 5 ]; then
              echo "pnpm install failed too many times" >&2
              exit 1
            fi
            echo "pnpm install failed $i, trying again..."
          done
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save node_modules cache
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        uses: ./.github/actions/save-node-modules

      # Electron typings live in .build/typings (not node_modules), so they are
      # absent after a node_modules cache hit; mirror upstream pr.yml.
      - name: Prepare Electron types
        run: node build/npm/electronTypes.ts

      - name: Type check client (src/)
        run: pnpm run typecheck-client

      - name: Transpile client
        run: pnpm run transpile-client

      - name: Run node unit tests
        run: pnpm run test-node

      - name: Lint Cognify-owned code
        run: pnpm exec eslint extensions/cognify-ai scripts/cognify build/cognify

      - name: Cognify AI extension unit tests
        working-directory: extensions/cognify-ai
        run: |
          pnpm run typecheck-test
          pnpm test

      - name: Install Electron runtime dependencies
        run: sudo apt-get update -y && sudo apt-get install -y xvfb libgtk-3-0 libgbm1

      - name: Setup Electron
        uses: ./.github/actions/setup-electron
        with:
          arch: x64
          save-cache: 'true'

      # S6-16: build cognify-ai the two ways Cognify ships it (the dev build's gulp task and the
      # product's packaging) and activate each; CI otherwise compiles it with tsc only (B1).
      - name: Cognify AI shipped-build check
        run: xvfb-run -a pnpm -C extensions/cognify-ai run test-shipped-build

      # The MVP scenario test (S6-06) creates a FastAPI project on the host and runs its own
      # pip install, pytest and uvicorn, so python3 and pip must be a Python it may install into.
      - name: Python for the MVP scenario test
        run: |
          python3 -m venv "$RUNNER_TEMP/cognify-python"
          echo "$RUNNER_TEMP/cognify-python/bin" >> "$GITHUB_PATH"

      - name: Cognify AI integration tests (fake providers)
        run: xvfb-run -a pnpm -C extensions/cognify-ai run test-integration
        env:
          # Also run the Dev Container CLI test (S4-03): GitHub's Ubuntu runners have Docker.
          COGNIFY_TEST_DOCKER: '1'
          # And the MVP scenario end to end (S6-06), with real pip, pytest and uvicorn.
          COGNIFY_TEST_MVP: '1'

      - name: Check Cognify product identity
        run: node scripts/cognify/check-product-identity.mts

      - name: Check Cognify upstream baseline
        run: node scripts/cognify/check-upstream-baseline.mts

      - name: Check for new "VS Code" strings
        run: node scripts/cognify/vscode-strings.mts

      - name: Check the NLS rebrand table
        run: node scripts/cognify/nls-rebrand.mts

      - name: NLS rebrand build tests
        run: node --test 'build/cognify/test/*.test.ts'

  # S6-16: Windows-only defects (B2, B3 in DevDocs/Quality/DEV_BUILD_VERIFICATION_2026-11-05.md)
  # passed the Linux job. The unit tests need only the extension's dependencies and the
  # TypeScript compiler, so this installs without scripts (no native builds, no Electron).
  cognify-ai-windows:
    name: Cognify AI Unit Tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: ./.github/actions/setup-pnpm

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter cognify-ai --ignore-scripts

      - name: Cognify AI extension unit tests
        working-directory: extensions/cognify-ai
        run: |
          pnpm run typecheck-test
          pnpm test
