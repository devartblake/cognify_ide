[project]
name = "{{packageName}}"
version = "0.1.0"
description = "{{projectName}}: a FastAPI service."
requires-python = ">=3.10"
dependencies = [
	"fastapi>=0.162,<1",
	"uvicorn[standard]>=0.54,<1",
]

[project.optional-dependencies]
dev = [
	"pytest>=9.2,<10",
	"httpx2>=2.16,<3",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
